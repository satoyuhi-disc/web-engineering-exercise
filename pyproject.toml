[project]
name = "blogsite"
version = "0.1.0"
description = "Blog Post Creation Website — Web Engineering course project"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.7",
    "django-htmx>=1.28.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "coverage>=7.15.2",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "blogsite.settings"
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["blog"]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "blogsite/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
