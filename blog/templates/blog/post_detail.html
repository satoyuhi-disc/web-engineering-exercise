{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
  <article>
    <h1>{{ post.title }}</h1>
    <p class="post-meta">
      By <a href="{% url 'blog:author_posts' post.author.username %}">{{ post.author.username }}</a>
      on <time datetime="{{ post.created_at|date:'Y-m-d' }}">{{ post.created_at|date:"N j, Y" }}</time>
    </p>
    <div class="post-body">{{ post.content|linebreaks }}</div>
  </article>
  <p><a href="{% url 'blog:post_list' %}">&larr; Back to all posts</a></p>
{% endblock %}
